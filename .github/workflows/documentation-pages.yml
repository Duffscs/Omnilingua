name: Documentation GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'SamplePlugins/**'
      - '.github/workflows/documentation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire la documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Installer les dépendances
        run: npm ci
        working-directory: docs
      - name: Construire le site
        run: npm run build
        working-directory: docs
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Transférer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publier la documentation
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
